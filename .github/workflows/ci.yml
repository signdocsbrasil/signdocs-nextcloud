name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint, static analysis, unit tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: php -l (syntax)
        run: |
          set -e
          for f in $(find lib tests appinfo templates -name '*.php'); do
            php -l "$f" >/dev/null
          done

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Validate appinfo/info.xml
        run: |
          set -e
          curl -sf https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd -o /tmp/nc-info.xsd
          xmllint --noout --schema /tmp/nc-info.xsd appinfo/info.xml

      - name: l10n parity (json vs js)
        run: bin/check-l10n.sh

      - name: PHP CS Fixer (dry-run)
        run: composer cs:check

      - name: PHPStan
        run: composer stan

      - name: PHPUnit (unit)
        run: composer test

  build:
    name: Build app archive
    runs-on: ubuntu-24.04
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Build archive
        run: bin/build-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signdocs_brasil-archive
          path: signdocs_brasil-*.tar.gz
          retention-days: 30
